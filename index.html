<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#162c33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="내 스캐너"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>내 스캐너</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><span class="eyebrow">PRIVATE DOCUMENT SCANNER</span><h1>내 스캐너</h1><p>종이 문서를 깔끔한 PDF로.</p></div><div class="badge">▤</div></header>
<section id="home"><div class="intro"><h2>새 문서 스캔</h2><p>사진을 찍거나 가져온 후 문서의 네 모서리를 맞춰 주세요.</p><label class="button primary" for="camera">📷 &nbsp; 사진 촬영</label><input id="camera" type="file" accept="image/*" capture="environment"><label class="button secondary" for="gallery">사진 보관함에서 가져오기</label><input id="gallery" type="file" accept="image/*"></div><div class="pages-head"><div><span class="eyebrow dark">YOUR DOCUMENT</span><h2>스캔한 페이지 <span id="count">0</span></h2></div><button id="clear" class="textbtn" hidden>전체 삭제</button></div><p id="empty" class="empty">아직 스캔한 페이지가 없습니다.</p><div id="pages" class="pages"></div><button id="pdf" class="button primary" disabled>PDF 저장 또는 공유</button><p class="note">사진은 이 기기에서만 처리됩니다. 페이지는 브라우저를 닫거나 새로고침하면 사라지므로 PDF를 저장해 주세요.</p></section>
<section id="editor" hidden><div class="edithead"><button id="cancel" class="textbtn">‹ 취소</button><strong>문서 영역 선택</strong><span></span></div><p class="hint">동그란 점을 움직여 종이의 네 모서리에 맞추세요.</p><div class="canvas-wrap"><canvas id="source"></canvas></div><div class="mode"><span>보정 방식</span><div><button data-mode="color" class="selected">컬러</button><button data-mode="gray">흑백</button><button data-mode="bw">문서</button></div></div><p class="note">‘문서’는 글자를 선명하게 만들지만 사진이나 음영이 사라질 수 있습니다.</p><button id="add" class="button primary">페이지 추가</button></section><div id="status" role="status" aria-live="polite"></div></main><script src="app.js"></script></body></html>
